---
name: Warm vulnix NVD cache

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  warm-cache-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore vulnix NVD cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-Linux-${{ hashFiles('.vulnix-whitelist.toml') }}
          restore-keys: vulnix-nvd-Linux-
      - name: Build
        run: nix build
      - name: Prepare system whitelist
        run: cp .vulnix-whitelist-system.toml.example .vulnix-whitelist-system.toml
      - name: Warm NVD cache
        run: >-
          TERM=dumb nix develop .#ci --ignore-environment --keep TERM --keep HOME
          --command bash -c 'lefthook-vulnix-scan'

  warm-cache-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore vulnix NVD cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-macOS-${{ hashFiles('.vulnix-whitelist.toml') }}
          restore-keys: vulnix-nvd-macOS-
      - name: Build
        run: nix build
      - name: Prepare system whitelist
        run: cp .vulnix-whitelist-system.toml.example .vulnix-whitelist-system.toml
      - name: Warm NVD cache
        run: >-
          TERM=dumb nix develop .#ci --ignore-environment --keep TERM --keep HOME
          --command bash -c 'lefthook-vulnix-scan'
